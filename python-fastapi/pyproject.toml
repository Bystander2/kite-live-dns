[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kite-x402-fastapi"
version = "0.1.0"
description = "FastAPI x402 reverse-proxy template for Kite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "x402[evm,fastapi]>=2.24,<3"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
kite-x402-fastapi = "kite_x402_fastapi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kite_x402_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

